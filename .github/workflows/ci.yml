name: Laravel CI Pipeline

on:
  push:
    branches: [ main, dev, feature/movie-list ]
  pull_request:
    branches: [ main, dev ]

jobs:
  php-syntax-check:
    name: Job 1 - PHP Syntax Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run PHP Syntax Check
        run: |
          for file in $(find app routes -name "*.php"); do
            php -l "$file" || exit 1
          done

  laravel-unit-tests:
    name: Job 2 - Laravel PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        run: php artisan test 